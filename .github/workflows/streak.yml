name: Streak Card

on:
  schedule:
    - cron: "7 * * * *"              # every hour
  repository_dispatch:
    types: [commit-pushed]           # instant trigger from other repos (Layer 2)
  workflow_dispatch:                 # manual "Run workflow" button
  push:
    paths:
      - scripts/generate_streak.py   # regenerate when you edit the script

concurrency:
  group: streak-card
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_streak.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update streak card"
          git pull --rebase
          git push
